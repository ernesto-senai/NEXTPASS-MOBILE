# Versão web do app no Render, como site estático (grátis). No painel do Render:
# New > Blueprint, escolha este repositório e informe o endereço da API publicada.
services:
  - type: web
    name: nextpass-app
    runtime: static
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: NODE_VERSION
        value: "24"
    # As rotas do app (ex.: /olheiro/perfil) são do Expo Router: todas abrem o index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
